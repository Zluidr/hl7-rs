[package]
name = "hl7-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Zero-dependency HL7 v2 message parser — bytes to typed AST, no transport, no runtime"
readme = "README.md"
repository = "https://github.com/Zluidr/hl7-rs"
license = "Apache-2.0"
keywords = ["hl7", "healthcare", "medical", "parser", "interoperability"]
categories = ["encoding", "parser-implementations", "science"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse"
harness = false
